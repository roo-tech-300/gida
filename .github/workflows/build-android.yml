name: Build Android APK

on:
  push:
    branches:
      - builds
      - dev

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_WORKER_URL=${{ secrets.EXPO_PUBLIC_WORKER_URL }}" >> .env

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Setup Java & Cache Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set gradlew executable permissions
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Building development APK for dev branch"
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            echo "Building production APK for builds branch"
            ./gradlew assembleRelease --no-daemon --stacktrace --info
          fi

      - name: Create GitHub Release for production builds
        if: github.ref_name == 'builds'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Android build #${{ github.run_number }}"
          body: Automated release APK built from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Upload dev APK artifact
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error