<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0e0e10" />
    <title>Page not found | Gida</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0e0e10; color: #f2f2f7; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 480px); padding: 40px; border: 1px solid rgba(255,255,255,.1); border-radius: 24px; background: rgba(27,27,29,.85); text-align: center; }
      .mark { color: #d4ba88; font-size: 13px; font-weight: 700; letter-spacing: .22em; }
      h1 { margin: 24px 0 12px; font-size: clamp(28px, 7vw, 40px); }
      p { margin: 0; color: #c7c4d8; line-height: 1.6; }
      a { display: inline-flex; margin-top: 28px; padding: 13px 20px; border-radius: 12px; background: #9d7e43; color: #0e0e10; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #d4ba88; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">GIDA</div>
      <h1>We can’t find that page</h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <a href="/">Back to Gida</a>
    </main>
  </body>
</html>
