    <style>
      .download-app-link[hidden] {
        display: none !important;
      }

      .download-app-link {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 12px 20px;
        border: 1px solid #b8944f;
        border-radius: 9999px;
        background: linear-gradient(135deg, #b8944f, #9d7e43);
        box-shadow: 0 8px 24px #9d7e4359;
        color: #fff;
        font: 600 0.875rem "Outfit", sans-serif;
        letter-spacing: 0.04em;
        text-decoration: none;
        cursor: pointer;
      }

      .download-app-link:hover {
        background: linear-gradient(135deg, #5c3c01, #b8944f);
        color: #fff;
      }

      .download-app-spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: download-app-spin 0.8s linear infinite;
      }

      .download-app-link[data-state="downloading"] {
        cursor: progress;
        pointer-events: none;
      }

      .download-app-link[data-state="downloading"] .download-app-icon {
        display: none;
      }

      .download-app-link[data-state="downloading"] .download-app-spinner {
        display: inline-block;
      }

      @keyframes download-app-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 540px) {
        .download-app-link {
          right: 16px;
          bottom: 16px;
          left: 16px;
        }
      }
    </style>

  <body>
    <div id="root"></div>
    <a
      class="download-app-link"
      href="https://github.com/roo-tech-300/gida/releases/download/build-116/Gida.apk"
      aria-label="Download the Gida Android app"
      hidden
    >
      <svg class="download-app-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.6 9.48 19.44 6.3a.5.5 0 0 0-.87-.5l-1.86 3.22a11.4 11.4 0 0 0-9.42 0L5.43 5.8a.5.5 0 1 0-.87.5L6.4 9.48A10.2 10.2 0 0 0 2 17h20a10.2 10.2 0 0 0-4.4-7.52ZM7.5 13.25a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Zm9 0a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5Z" />
        <path d="M4 18h16v1a2 2 0 0 1-2 2h-1v1.5a1 1 0 0 1-2 0V21H9v1.5a1 1 0 0 1-2 0V21H6a2 2 0 0 1-2-2v-1Z" />
      </svg>
      <span class="download-app-spinner" aria-hidden="true"></span>
      <span class="download-app-label">Download Android app</span>
    </a>
    <noscript data-app-launch="false">
      <main>
        <h1>Student housing and lodges in Nigeria</h1>
        <p>Find verified student lodges, connect with compatible roommates, and get settled with Gida.</p>
        <p><a href="/signup">Get started</a> · <a href="/login">Log in</a></p>
      </main>
    </noscript>
    <script>
      // Driven by constants/launch.ts via ?launched= from the Expo web shell.
      // Default false so a standalone visit never shows the APK button pre-launch.
      const launchedParam = new URLSearchParams(window.location.search).get('launched');
      const IS_APP_LAUNCHED = launchedParam === '1';
      const isAndroidPhone = /Android/i.test(navigator.userAgent) && /Mobile/i.test(navigator.userAgent);
      const downloadAppLink = document.querySelector('.download-app-link');

      if (IS_APP_LAUNCHED && isAndroidPhone && downloadAppLink) {
        downloadAppLink.hidden = false;

        const label = downloadAppLink.querySelector('.download-app-label');
        const defaultLabel = label ? label.textContent : 'Download Android app';
        const apkUrl = downloadAppLink.getAttribute('href');
        let downloadFrame = null;
        let resetTimer;

        const startBackgroundDownload = (url) => {
          // Load the APK through a hidden iframe instead of navigating the
          // tab. GitHub answers with Content-Disposition: attachment, so the
          // browser hands the file to its download manager while the landing
          // page (and the URL bar) stays exactly where it is. The download
          // then continues in the background even if the page is closed.
          if (!downloadFrame) {
            downloadFrame = document.createElement('iframe');
            downloadFrame.title = 'Gida APK download';
            downloadFrame.setAttribute('aria-hidden', 'true');
            downloadFrame.style.cssText =
              'position:absolute;width:0;height:0;border:0;visibility:hidden;';
            document.body.appendChild(downloadFrame);
          }

          const separator = url.indexOf('?') === -1 ? '?' : '&';
          downloadFrame.src = url + separator + '_=' + Date.now();
        };

        downloadAppLink.addEventListener('click', (event) => {
          if (!apkUrl) {
            return;
          }

          event.preventDefault();

          downloadAppLink.setAttribute('data-state', 'downloading');
          downloadAppLink.setAttribute('aria-busy', 'true');
          if (label) {
            label.textContent = 'Downloading…';
          }

          startBackgroundDownload(apkUrl);

          window.clearTimeout(resetTimer);
          resetTimer = window.setTimeout(() => {
            downloadAppLink.removeAttribute('data-state');
            downloadAppLink.removeAttribute('aria-busy');
            if (label) {
              label.textContent = defaultLabel;
            }
          }, 8000);
        });
      } else if (downloadAppLink) {
        downloadAppLink.remove();
      }
    </script>
  </body>
