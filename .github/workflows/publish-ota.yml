name: Publish OTA update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        required: true
        options:
          - tester
          - production

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo credentials
        run: |
          test -n "$EXPO_PROJECT_ID" || { echo "Set the EXPO_PROJECT_ID repository variable."; exit 1; }
          test -n "$EXPO_TOKEN" || { echo "Set the EXPO_TOKEN repository secret."; exit 1; }

      - name: Publish update
        run: npx eas-cli update --channel "${{ inputs.channel }}" --message "GitHub Actions update ${{ github.sha }}" --non-interactive
