name: Build Android APK

on:
  push:
    branches:
      - builds
      - dev

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo project ID
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: test -n "$EXPO_PROJECT_ID" || { echo "Set the EXPO_PROJECT_ID repository variable before building OTA-enabled APKs."; exit 1; }

      - name: Set update channel
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "EXPO_UPDATES_CHANNEL=tester" >> "$GITHUB_ENV"
          else
            echo "EXPO_UPDATES_CHANNEL=production" >> "$GITHUB_ENV"
          fi

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "EXPO_PUBLIC_WORKER_URL=${{ secrets.EXPO_PUBLIC_WORKER_URL }}" >> .env

      - name: Prebuild Android project
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: npx expo prebuild --platform android

      - name: Setup Java & Cache Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Configure production signing
        if: github.ref_name == 'builds'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required GitHub secret $secret_name is missing."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          contents = gradle_file.read_text()
          new_config = """    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  storeFile file('release.keystore')
                  storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('ANDROID_KEY_ALIAS')
                  keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
          }"""
          contents, config_count = re.subn(r"(?ms)^    signingConfigs \{\n.*?^    \}", lambda _: new_config, contents, count=1)
          if config_count != 1:
              raise SystemExit("Could not locate the expected Expo signingConfigs block; refusing to build with uncertain signing.")
          contents, release_count = re.subn(
              r"(?ms)(^        release \{\n.*?^            signingConfig )signingConfigs\.debug",
              r"\1signingConfigs.release",
              contents,
              count=1,
          )
          if release_count != 1:
              raise SystemExit("Could not locate debug signing in the release build type.")
          gradle_file.write_text(contents)
          PY

      - name: Set gradlew executable permissions
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC' -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "Building development APK for dev branch"
            ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64
          else
            echo "Building production APK for builds branch"
            ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,x86_64
          fi

      - name: Verify production APK signature
        if: github.ref_name == 'builds'
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Could not find apksigner in the Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Create GitHub Release for production builds
        if: github.ref_name == 'builds'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Android build #${{ github.run_number }}"
          body: Automated release APK built from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true

      - name: Upload dev APK artifact
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: android-dev-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
